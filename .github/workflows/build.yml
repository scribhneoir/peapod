name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Playdate SDK
        id: playdate
        uses: pd-rs/get-playdate-sdk@0.4

      - name: Build PDX
        run: pdc src Peapod.pdx

      - name: Upload PDX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peapod.pdx
          path: Peapod.pdx
